<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="row w-100">
      <div class="col-md-6 offset-md-3 col-lg-4 offset-lg-4 login-box">
        <div class="brand">💰 Finan$ys</div>
        <h2 class="text-center login-title mb-4">Login</h2>

        <form [formGroup]="loginForm" (submit)="submitForm()">
          <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input type="text" class="form-control" id="username" formControlName="username" placeholder="Digite seu usuário" required />
            </div>
            <app-form-field-error [form-control]="loginForm.get('username')!"></app-form-field-error>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="password" formControlName="password" placeholder="Digite sua senha" required />
            </div>
          </div>

          <div class="d-grid">
            <button [disabled]="loginForm.invalid" type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
